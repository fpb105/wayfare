<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trip Type</title>
</head>
<body>
  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}

  <form method="post">
    {% csrf_token %}

    {{ form.non_field_errors }}

    <p>
      {{ form.type.label_tag }} {{ form.type }}
      {{ form.type.errors }}
    </p>

    <button type="submit">Continue</button>
  </form>
</body>
</html>
