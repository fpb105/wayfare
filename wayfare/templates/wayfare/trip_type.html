{% extends "wayfare/main.html" %}
{% block title %}Trip Type{% endblock %}

    {% csrf_token %}

    {{ form.non_field_errors }}

    <p>
      {{ form.type.label_tag }} {{ form.type }}

    <button type="submit">Continue</button>
  </form>
{% endblock %}
